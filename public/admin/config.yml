# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration. Field definitions must stay in sync with the Zod
# schemas in src/content.config.ts (and src/lib/site.ts for site settings),
# otherwise `npm run build` fails on content the CMS saved.
# Docs: docs/CMS.md and https://sveltiacms.app/en/docs

backend:
  name: github
  repo: TyRichards/paradox
  branch: main
  # Until base_url is set, use "Sign In Using Access Token" (the "Sign In with
  # GitHub" button defaults to Netlify's OAuth, which this site doesn't use).
  # For one-click GitHub sign-in, deploy Sveltia CMS Authenticator to a free
  # Cloudflare Worker and set its URL here (see docs/CMS.md):
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev

site_url: https://paradoxcreative.com
logo:
  src: /admin/logo.png
  show_in_header: true

media_folder: public/images/uploads
public_folder: /images/uploads

output:
  omit_empty_optional_fields: true

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: blog
    label: Blog
    label_singular: Post
    description: Blog posts. Files live in src/content/blog/.
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: /blog/{{slug}}/
    summary: '{{pubDate | date("YYYY-MM-DD")}} — {{title}}'
    sortable_fields:
      fields: [pubDate, title]
      default:
        field: pubDate
        direction: descending
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, required: false, hint: 'Used for the post list, search results and social previews.' }
      - { name: pubDate, label: Publish date, widget: datetime, type: date }
      - { name: updatedDate, label: Updated date, widget: datetime, type: date, required: false }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: coverAlt, label: Cover image alt text, widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: 'Drafts show in `npm run dev` but are left out of the production build.' }
      - { name: placeholder, label: Placeholder, widget: boolean, default: false, hint: 'Shows a “placeholder content” notice on the page.' }
      - name: legacy
        label: WordPress origin
        widget: object
        required: false
        collapsed: true
        readonly: true
        fields:
          - { name: wpId, label: WordPress ID, widget: number, value_type: int, required: false }
          - { name: url, label: Original URL, widget: string, required: false }
      - { name: body, label: Body, widget: richtext }

  - name: work
    label: Work
    label_singular: Project
    description: Portfolio projects. Files live in src/content/work/. Imported from the live WordPress portfolio.
    folder: src/content/work
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: /work/{{slug}}/
    summary: '{{title}} — {{summary}}'
    sortable_fields:
      fields: [order, title]
      default:
        field: order
        direction: ascending
    view_filters:
      filters:
        - { name: brand, label: Brand, field: types, pattern: brand }
        - { name: web, label: Web, field: types, pattern: web }
        - { name: print, label: Print, field: types, pattern: print }
        - { name: app, label: App, field: types, pattern: app }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: string, required: false, hint: 'One-line descriptor, e.g. “Brochure Website”.' }
      - name: types
        label: Types
        widget: select
        multiple: true
        required: false
        options:
          - { label: Brand, value: brand }
          - { label: Web, value: web }
          - { label: Print, value: print }
          - { label: App, value: app }
      - { name: client, label: Client, widget: string, required: false }
      - { name: projectDate, label: Project date, widget: string, required: false, hint: 'Free text, e.g. “July 2012”.' }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 999, hint: 'Lower numbers appear first.' }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: coverAlt, label: Cover image alt text, widget: string, required: false }
      - { name: gallery, label: Gallery images, widget: list, field: { name: image, widget: image }, required: false }
      - { name: featured, label: Featured on home page, widget: boolean, default: false }
      - { name: placeholder, label: Placeholder, widget: boolean, default: false, hint: 'Shows a “placeholder content” notice on the page.' }
      - name: legacy
        label: WordPress origin
        widget: object
        required: false
        collapsed: true
        readonly: true
        fields:
          - { name: wpId, label: WordPress ID, widget: number, value_type: int, required: false }
          - { name: url, label: Original URL, widget: string, required: false }
          - { name: modified, label: Last modified in WordPress, widget: datetime, type: date, required: false }
          - { name: thumbnail, label: Original thumbnail URL, widget: string, required: false }
          - { name: gallery, label: Original gallery image URLs, widget: list, required: false }
      - { name: body, label: Write-up, widget: richtext, required: false }

  - name: services
    label: Services
    label_singular: Service
    description: Service cards on /services/ and the home page. Files live in src/content/services/.
    folder: src/content/services
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    sortable_fields:
      fields: [order, title]
      default:
        field: order
        direction: ascending
    fields:
      - { name: title, label: Title, widget: string }
      - { name: summary, label: Summary, widget: string }
      - name: workType
        label: Linked work type
        widget: select
        required: false
        hint: Links the service card to the matching /work/type/ page.
        options:
          - { label: Brand, value: brand }
          - { label: Web, value: web }
          - { label: Print, value: print }
          - { label: App, value: app }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 999 }
      - { name: placeholder, label: Placeholder, widget: boolean, default: false }
      - { name: body, label: Body, widget: richtext, required: false }

  - name: pages
    label: Pages
    description: Fixed site pages. Files live in src/content/pages/.
    files:
      - name: home
        label: Home
        file: src/content/pages/home.md
        preview_path: /
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text, required: false }
          - { name: heading, label: Hero heading, widget: text }
          - name: ctas
            label: Hero buttons
            widget: list
            required: false
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - { name: body, label: Intro, widget: richtext }
      - name: about
        label: About
        file: src/content/pages/about.md
        preview_path: /about/
        fields: &page_fields
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text, required: false }
          - { name: placeholder, label: Placeholder, widget: boolean, default: false }
          - { name: body, label: Body, widget: richtext }
      - { name: services, label: Services intro, file: src/content/pages/services.md, preview_path: /services/, fields: *page_fields }
      - { name: contact, label: Contact, file: src/content/pages/contact.md, preview_path: /contact/, fields: *page_fields }
      - { name: privacy, label: Privacy policy, file: src/content/pages/privacy.md, preview_path: /privacy/, fields: *page_fields }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site settings
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: Site name, widget: string }
          - { name: title, label: Default page title, widget: string }
          - { name: description, label: Default meta description, widget: text }
          - { name: owner, label: Owner, widget: string }
          - { name: emailDisplay, label: Email (display text), widget: string, hint: 'Shown as text to limit scraping, e.g. “ty at paradoxcreative dot com”.' }
          - name: nav
            label: Main navigation
            widget: list
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
