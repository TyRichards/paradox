# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json
#
# Sveltia CMS configuration. Field definitions must stay in sync with the Zod
# schemas in src/content.config.ts (and src/lib/site.ts for site settings),
# otherwise `npm run build` fails on content the CMS saved.
# Docs: docs/CMS.md and https://sveltiacms.app/en/docs

backend:
  name: github
  repo: TyRichards/paradox
  branch: main
  # Until base_url is set, use "Sign In Using Access Token" (the "Sign In with
  # GitHub" button defaults to Netlify's OAuth, which this site doesn't use).
  # For one-click GitHub sign-in, deploy Sveltia CMS Authenticator to a free
  # Cloudflare Worker and set its URL here (see docs/CMS.md):
  # base_url: https://sveltia-cms-auth.<your-subdomain>.workers.dev

# site_url is omitted on purpose: Sveltia falls back to the origin the CMS is
# opened on, so previews work on pages.dev and any custom domain.
logo:
  src: /admin/logo.png
  show_in_header: true

media_folder: public/images/uploads
public_folder: /images/uploads

output:
  omit_empty_optional_fields: true

slug:
  encoding: ascii
  clean_accents: true

collections:
  - name: blog
    label: Blog
    label_singular: Post
    description: Blog posts. Files live in src/content/blog/.
    folder: src/content/blog
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: /blog/{{slug}}/
    summary: '{{pubDate | date("YYYY-MM-DD")}} — {{title}}'
    sortable_fields:
      fields: [pubDate, title]
      default:
        field: pubDate
        direction: descending
    fields:
      - { name: title, label: Title, widget: string }
      - { name: description, label: Description, widget: text, required: false, hint: 'Used for the post list, search results and social previews.' }
      - { name: pubDate, label: Publish date, widget: datetime, type: date }
      - { name: updatedDate, label: Updated date, widget: datetime, type: date, required: false }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: coverAlt, label: Cover image alt text, widget: string, required: false }
      - { name: tags, label: Tags, widget: list, required: false }
      - { name: draft, label: Draft, widget: boolean, default: false, hint: 'Drafts show in `npm run dev` but are left out of the production build.' }
      - name: legacy
        label: WordPress origin
        widget: object
        required: false
        collapsed: true
        readonly: true
        fields:
          - { name: wpId, label: WordPress ID, widget: number, value_type: int, required: false }
          - { name: url, label: Original URL, widget: string, required: false }
      - { name: body, label: Body, widget: richtext }

  - name: work
    label: Work
    label_singular: Project
    description: Portfolio projects. Files live in src/content/work/. Only entries marked Published get a page and appear in listings.
    folder: src/content/work
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: /work/{{slug}}/
    summary: '{{title}} — {{summary}}'
    sortable_fields:
      fields: [order, title, published]
      default:
        field: order
        direction: ascending
    view_filters:
      filters:
        - { name: published, label: Published, field: published, pattern: true }
        - { name: brand, label: Brand, field: types, pattern: brand }
        - { name: web, label: Web, field: types, pattern: web }
        - { name: print, label: Print, field: types, pattern: print }
        - { name: app, label: App, field: types, pattern: app }
    fields:
      - { name: title, label: Title, widget: string }
      - { name: published, label: Published, widget: boolean, default: false, hint: 'Off keeps the file but hides the project: no page, not listed.' }
      - { name: summary, label: Summary, widget: string, required: false, hint: 'One-line descriptor, e.g. “Brochure Website”.' }
      - name: types
        label: Types
        widget: select
        multiple: true
        required: false
        options:
          - { label: Brand, value: brand }
          - { label: Web, value: web }
          - { label: Print, value: print }
          - { label: App, value: app }
      - { name: client, label: Client, widget: string, required: false }
      - { name: projectDate, label: Project date, widget: string, required: false, hint: 'Free text, e.g. “July 2012”.' }
      - { name: projectUrl, label: Live site URL, widget: string, type: url, required: false, hint: 'Adds a “Visit the live site” button.' }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 999, hint: 'Lower numbers appear first.' }
      - { name: cover, label: Cover image, widget: image, required: false }
      - { name: coverAlt, label: Cover image alt text, widget: string, required: false }
      - { name: gallery, label: Gallery images, widget: list, field: { name: image, widget: image }, required: false }
      - { name: featured, label: Featured on home page, widget: boolean, default: false }
      - name: legacy
        label: WordPress origin
        widget: object
        required: false
        collapsed: true
        readonly: true
        fields:
          - { name: wpId, label: WordPress ID, widget: number, value_type: int, required: false }
          - { name: url, label: Original URL, widget: string, required: false }
          - { name: modified, label: Last modified in WordPress, widget: datetime, type: date, required: false }
          - { name: thumbnail, label: Original thumbnail URL, widget: string, required: false }
          - { name: gallery, label: Original gallery image URLs, widget: list, required: false }
      - { name: body, label: Write-up, widget: richtext, required: false }

  - name: offers
    label: Offers
    label_singular: Offer
    description: Pricing cards on /pricing/ and the home page. Files live in src/content/offers/. The filename is the id used in /contact/?offer=<id>.
    folder: src/content/offers
    extension: md
    format: frontmatter
    create: true
    slug: '{{slug}}'
    preview_path: /pricing/
    summary: '{{price}} {{cadence}} — {{title}}'
    sortable_fields:
      fields: [order, title]
      default:
        field: order
        direction: ascending
    fields:
      - { name: title, label: Title, widget: string }
      - { name: price, label: Price, widget: string, hint: 'Shown as written, e.g. “$79”.' }
      - { name: cadence, label: Billing, widget: string, required: false, hint: 'e.g. “one-time” or “per month”.' }
      - { name: summary, label: Short description, widget: text }
      - { name: bullets, label: Bullet points, widget: list, min: 3, max: 5, field: { name: bullet, label: Bullet, widget: string } }
      - { name: ctaLabel, label: Button label, widget: string, hint: 'The button links to the contact form with this offer preselected.' }
      - { name: featured, label: Featured (main offer), widget: boolean, default: false }
      - { name: featuredLabel, label: Featured badge, widget: string, required: false }
      - { name: order, label: Sort order, widget: number, value_type: int, default: 999, hint: 'Lower numbers appear first.' }

  - name: pages
    label: Pages
    description: Fixed site pages. Files live in src/content/pages/.
    files:
      - name: home
        label: Home
        file: src/content/pages/home.md
        preview_path: /
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text, required: false }
          - { name: eyebrow, label: Hero eyebrow, widget: string, required: false }
          - { name: heading, label: Hero heading, widget: text }
          - { name: lede, label: Hero lede, widget: text, required: false }
          - name: portrait
            label: Hero portrait
            widget: object
            required: false
            fields:
              - { name: src, label: Image, widget: image }
              - { name: alt, label: Alt text, widget: string }
          - &ctas_field
            name: ctas
            label: Buttons
            widget: list
            required: false
            fields:
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - name: offersSection
            label: Offers section
            widget: object
            required: false
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: intro, label: Intro, widget: text, required: false }
              - { name: linkLabel, label: Link to pricing label, widget: string }
          - name: workSection
            label: Work section
            widget: object
            required: false
            hint: Shows published work only. Hidden when nothing is published.
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: linkLabel, label: Link to all work label, widget: string }
          - &audiences_field
            name: audiences
            label: Who it’s for
            widget: object
            required: false
            hint: Leave empty on Home to reuse the Pricing page’s list.
            fields:
              - { name: heading, label: Heading, widget: string }
              - name: items
                label: Audiences
                widget: list
                fields:
                  - { name: title, label: Title, widget: string }
                  - { name: body, label: Description, widget: text }
          - &closing_field
            name: closing
            label: Closing call to action
            widget: object
            required: false
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - name: cta
                label: Button
                widget: object
                fields:
                  - { name: label, label: Label, widget: string }
                  - { name: href, label: Link, widget: string }
          - { name: body, label: Intro, widget: richtext }
      - name: pricing
        label: Pricing
        file: src/content/pages/pricing.md
        preview_path: /pricing/
        fields:
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text, required: false }
          - { name: eyebrow, label: Eyebrow, widget: string, required: false }
          - { name: heading, label: Heading, widget: string, required: false }
          - { name: lede, label: Lede, widget: text, required: false }
          - *audiences_field
          - *closing_field
          - { name: body, label: Notes below the cards, widget: richtext, required: false }
      - name: about
        label: About
        file: src/content/pages/about.md
        preview_path: /about/
        fields: &page_fields
          - { name: title, label: Title, widget: string }
          - { name: description, label: Meta description, widget: text, required: false }
          - { name: eyebrow, label: Eyebrow, widget: string, required: false }
          - { name: heading, label: Heading, widget: string, required: false }
          - { name: lede, label: Lede, widget: text, required: false }
          - *closing_field
          - { name: body, label: Body, widget: richtext }
      - { name: contact, label: Contact, file: src/content/pages/contact.md, preview_path: /contact/, fields: *page_fields }
      - { name: privacy, label: Privacy policy, file: src/content/pages/privacy.md, preview_path: /privacy/, fields: *page_fields }

  - name: settings
    label: Site settings
    files:
      - name: site
        label: Site settings
        file: src/data/site.json
        format: json
        fields:
          - { name: name, label: Site name, widget: string }
          - { name: title, label: Default page title, widget: string }
          - { name: description, label: Default meta description, widget: text }
          - { name: owner, label: Owner, widget: string }
          - { name: emailDisplay, label: Email (display text), widget: string, hint: 'Shown as text to limit scraping, e.g. “ty at paradoxcreative dot com”.' }
          - name: nav
            label: Main navigation
            widget: list
            hint: The Blog link is hidden automatically while there are no published posts.
            fields: &link_fields
              - { name: label, label: Label, widget: string }
              - { name: href, label: Link, widget: string }
          - { name: navCta, label: Header button, widget: object, required: false, fields: *link_fields }
      - name: ui
        label: Interface text
        file: src/data/ui.json
        format: json
        fields:
          - name: header
            label: Header
            widget: object
            fields:
              - { name: skipToContent, label: Skip link (screen readers), widget: string }
              - { name: openMenu, label: Mobile menu button (screen readers), widget: string }
              - { name: menuTitle, label: Mobile menu title, widget: string }
          - name: footer
            label: Footer
            widget: object
            fields:
              - { name: heading, label: Heading, widget: string }
              - { name: text, label: Text, widget: text }
              - { name: cta, label: Button, widget: object, fields: *link_fields }
              - { name: tagline, label: Tagline (after the copyright), widget: string }
              - { name: links, label: Links, widget: list, fields: *link_fields }
              - { name: rssLabel, label: RSS link label, widget: string, hint: 'Shown only while there are posts.' }
          - name: pricing
            label: Pricing
            widget: object
            fields:
              - { name: featuredDefaultLabel, label: Featured badge fallback, widget: string }
          - name: work
            label: Work
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: description, label: Meta description, widget: text }
              - { name: lede, label: Lede, widget: text }
              - { name: empty, label: Empty state, widget: string }
              - { name: eyebrow, label: Project page eyebrow, widget: string }
              - { name: typeLabel, label: Type label, widget: string }
              - { name: clientLabel, label: Client label, widget: string }
              - { name: dateLabel, label: Date label, widget: string }
              - { name: visitSiteLabel, label: Live site button, widget: string }
              - { name: screenshotAltSuffix, label: Screenshot alt text suffix, widget: string, hint: 'Added after the project title.' }
              - { name: moreWorkLabel, label: Previous/next nav label (screen readers), widget: string }
              - name: types
                label: Work type labels
                widget: object
                fields:
                  - { name: brand, label: Brand, widget: string }
                  - { name: web, label: Web, widget: string }
                  - { name: print, label: Print, widget: string }
                  - { name: app, label: App, widget: string }
          - name: blog
            label: Blog
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: description, label: Meta and RSS description, widget: text }
              - { name: lede, label: Lede, widget: text }
              - { name: empty, label: Empty state, widget: string }
              - { name: eyebrow, label: Post eyebrow, widget: string }
              - { name: homeHeading, label: Home page heading, widget: string }
              - { name: updatedLabel, label: Updated label, widget: string }
              - { name: draftLabel, label: Draft badge, widget: string }
              - { name: feedTitle, label: RSS feed title, widget: string }
          - name: contact
            label: Contact form
            widget: object
            fields:
              - { name: nameLabel, label: Name label, widget: string }
              - { name: emailLabel, label: Email label, widget: string }
              - { name: companyLabel, label: Business name label, widget: string }
              - { name: offerLabel, label: Offer select label, widget: string }
              - { name: offerOther, label: Offer select fallback option, widget: string }
              - { name: messageLabel, label: Message label, widget: string }
              - { name: messagePlaceholder, label: Message placeholder, widget: text }
              - { name: submitLabel, label: Send button, widget: string }
              - { name: sendingLabel, label: Sending button, widget: string }
              - { name: successTitle, label: Success title, widget: string }
              - { name: successText, label: Success text, widget: text }
              - { name: errorTitle, label: Error title, widget: string }
              - { name: errorText, label: Generic error text, widget: text }
              - { name: notConfiguredTitle, label: Form-off title, widget: string }
              - { name: notConfiguredText, label: Form-off text, widget: text }
              - { name: tokenPending, label: Spam check pending, widget: text }
              - name: errors
                label: Error messages
                widget: object
                fields:
                  - { name: too_large, label: Too large, widget: text }
                  - { name: not_configured, label: Not configured, widget: text }
                  - { name: bad_request, label: Unreadable form, widget: text }
                  - { name: missing_fields, label: Missing fields, widget: text }
                  - { name: too_long, label: Field too long, widget: text }
                  - { name: invalid_email, label: Invalid email, widget: text }
                  - { name: spam_check, label: Spam check failed, widget: text }
                  - { name: send_failed, label: Send failed, widget: text }
          - name: notFound
            label: 404 page
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: lede, label: Lede, widget: text }
              - { name: backLabel, label: Back button, widget: string }
